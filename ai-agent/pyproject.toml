[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quickshow-ai-agent"
version = "0.1.0"
description = "Read-only QuickShow movie assistant built with Streamlit, LangChain, and Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.57,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "groq>=0.37,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tzdata>=2025.2,<2027.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
py-modules = ["agent", "api", "app", "backend", "index"]

[tool.vercel]
entrypoint = "api:app"